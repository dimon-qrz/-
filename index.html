<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Займи чергу і відпочинь</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        :root {
            --bg-color: #050505;
            --panel-bg: #121212;
            --text-color: #e0e0e0;
            --accent-color: #2563eb;
            --accent-danger: #dc2626;
            --accent-success: #10b981;
            --border-color: #262626;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            padding: 6px;
            overflow: hidden;
        }

        .phone-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 44vh;
            background: #000;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
        }

        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        canvas { z-index: 10; touch-action: none; }

        .controls-panel {
            margin-top: 6px;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: var(--panel-bg);
            padding: 8px;
            border-radius: 10px;
            font-size: 12px;
            border: 1px solid var(--border-color);
        }

        .row {
            display: flex;
            gap: 6px;
            align-items: center;
            justify-content: space-between;
        }

        button, select, input[type="range"] {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 10px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            outline: none;
        }

        select { background: #1f2937; width: 100%; color: #fff; }
        button:active { opacity: 0.8; }
        button.active { background: var(--accent-danger); }

        .status-badge {
            font-size: 12px;
            padding: 8px;
            border-radius: 6px;
            background: #1f2937;
            color: #9ca3af;
            font-weight: 700;
            text-align: center;
            width: 100%;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            border: 1px solid var(--border-color);
        }

        .status-badge.active {
            background: #064e3b;
            color: #34d399;
            border-color: #059669;
        }

        .status-badge.alarm {
            background: var(--accent-danger);
            color: #ffffff;
            animation: pulse-alarm 0.4s infinite alternate;
        }

        @keyframes pulse-alarm {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0.7; transform: scale(0.99); }
        }

        .slider-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #18181b;
            padding: 4px 8px;
            border-radius: 6px;
            width: 100%;
            border: 1px solid var(--border-color);
        }

        .slider-box label {
            white-space: nowrap;
            font-size: 11px;
            color: #a1a1aa;
        }

        /* Чорний оверлей для економії заряду */
        #ecoOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000000;
            z-index: 9999;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #222222;
            font-size: 13px;
            text-align: center;
            padding: 20px;
        }

        .author-footer {
            margin-top: auto;
            padding: 6px 0 2px 0;
            font-size: 10px;
            color: #71717a;
            text-align: center;
            line-height: 1.3;
        }

        .author-footer a {
            color: #3b82f6;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div id="ecoOverlay" onclick="exitEcoMode()">
        <p>⬛ ЕКОНОМІЯ БАТАРЕЇ АКТИВНА ⬛</p>
        <p style="margin-top: 8px; font-size: 11px; color: #1a1a1a;">Торкніться екрана для виходу</p>
    </div>

    <div class="phone-container">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
    </div>

    <div class="controls-panel">
        <div class="row">
            <select id="cameraSelect" onchange="switchCamera()"></select>
        </div>

        <div class="row">
            <select id="soundSelect" style="width: 100%;">
                <option value="beep">Звук: Імпульсний біп</option>
                <option value="sawtooth">Звук: Пилка / Сирена</option>
                <option value="siren">Звук: Двотональна тривога</option>
            </select>
        </div>

        <div class="row">
            <button id="toggleZoneBtn" onclick="toggleZoneDrawing()" style="width: 50%;">+ Зона фури</button>
            <button onclick="clearZone()" style="width: 50%; background: #3f3f46;">Вся область</button>
        </div>

        <div class="row">
            <div class="slider-box">
                <label for="sensitivity">Поріг рушень:</label>
                <input type="range" id="sensitivity" min="5" max="40" value="18" style="width: 100%;">
            </div>
        </div>

        <div class="row">
            <button id="alarmToggleBtn" onclick="toggleAlarmSystem()" style="width: 50%; background: var(--accent-success);">
                УВІМКНУТИ МОНІТОРИНГ
            </button>
            <button id="ecoBtn" onclick="enterEcoMode()" style="width: 50%; background: #374151;">
                🌙 ЕКО-РЕЖИМ
            </button>
        </div>

        <div class="row">
            <div id="status" class="status-badge">Камера готується...</div>
        </div>
    </div>

    <footer class="author-footer">
        <p>Програма створена за ініціативи <strong>Dima Lasun</strong> за допомоги <strong>Gemini</strong>.</p>
        <p>Долучайтеся до нашої спільноти у Facebook: 
            <a href="https://www.facebook.com/groups/3145673675685047" target="_blank" rel="noopener noreferrer">
                Приєднатися до групи
            </a>
        </p>
    </footer>

<script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('overlay');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const statusDiv = document.getElementById('status');
    const toggleZoneBtn = document.getElementById('toggleZoneBtn');
    const cameraSelect = document.getElementById('cameraSelect');
    const soundSelect = document.getElementById('soundSelect');
    const sensitivityInput = document.getElementById('sensitivity');
    const alarmToggleBtn = document.getElementById('alarmToggleBtn');
    const ecoOverlay = document.getElementById('ecoOverlay');

    let currentStream = null;
    let trackZone = null;
    let isDrawing = false;
    let startX = 0, startY = 0, currentX = 0, currentY = 0;
    let drawingMode = false;
    let systemActive = false;
    let wakeLock = null;

    let audioCtx = null;
    let oscillator = null;
    let gainNode = null;
    let alarmTimer = null;
    let isBeeping = false;

    let prevFrameData = null;
    let motionCanvas = document.createElement('canvas');
    let motionCtx = motionCanvas.getContext('2d', { willReadFrequently: true });

    async function getCameras() {
        try {
            const devices = await navigator.mediaDevices.enumerateDevices();
            const videoDevices = devices.filter(d => d.kind === 'videoinput');
            cameraSelect.innerHTML = '';
            videoDevices.forEach((device, index) => {
                const option = document.createElement('option');
                option.value = device.deviceId;
                let label = device.label || `Камера ${index + 1}`;
                if (label.toLowerCase().includes('back') || label.toLowerCase().includes('environment') || label.toLowerCase().includes('0')) {
                    label = `Основна (Задня) ${index + 1}`;
                } else if (label.toLowerCase().includes('front') || label.toLowerCase().includes('user') || label.toLowerCase().includes('1')) {
                    label = `Селфі (Передня) ${index + 1}`;
                }
                option.text = label;
                cameraSelect.appendChild(option);
            });
        } catch (e) {
            console.error("Помилка списку камер:", e);
        }
    }

    async function setupCamera(deviceId = null) {
        if (currentStream) currentStream.getTracks().forEach(t => t.stop());

        const constraints = {
            video: {
                deviceId: deviceId ? { exact: deviceId } : undefined,
                facingMode: { ideal: "environment" },
                width: { ideal: 1280 },
                height: { ideal: 720 }
            },
            audio: false
        };

        try {
            currentStream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = currentStream;
        } catch (err) {
            statusDiv.innerText = "Помилка камери: " + err.message;
        }

        return new Promise((resolve) => {
            video.onloadedmetadata = () => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                motionCanvas.width = 160;
                motionCanvas.height = 284;
                resolve(video);
            };
        });
    }

    async function switchCamera() {
        await setupCamera(cameraSelect.value);
    }

    async function requestWakeLock() {
        try {
            if ('wakeLock' in navigator) {
                wakeLock = await navigator.wakeLock.request('screen');
            }
        } catch (err) {
            console.log('Wake Lock Error:', err.message);
        }
    }

    function releaseWakeLock() {
        if (wakeLock !== null) {
            wakeLock.release();
            wakeLock = null;
        }
    }

    function enterEcoMode() {
        ecoOverlay.style.display = 'flex';
    }

    function exitEcoMode() {
        ecoOverlay.style.display = 'none';
    }

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function startAlarmSound() {
        if (isBeeping || !audioCtx) return;
        isBeeping = true;
        exitEcoMode();

        const selectedSound = soundSelect.value;

        if (selectedSound === 'siren') {
            let high = false;
            oscillator = audioCtx.createOscillator();
            gainNode = audioCtx.createGain();
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(600, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.8, audioCtx.currentTime);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();

            alarmTimer = setInterval(() => {
                if (oscillator && audioCtx) {
                    high = !high;
                    oscillator.frequency.setValueAtTime(high ? 900 : 600, audioCtx.currentTime);
                }
            }, 250);
        } else if (selectedSound === 'beep') {
            const playBeep = () => {
                if (!isBeeping) return;
                let osc = audioCtx.createOscillator();
                let g = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
                g.gain.setValueAtTime(0.9, audioCtx.currentTime);
                osc.connect(g);
                g.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            };
            playBeep();
            alarmTimer = setInterval(playBeep, 300);
        } else {
            oscillator = audioCtx.createOscillator();
            gainNode = audioCtx.createGain();
            oscillator.type = 'sawtooth';
            oscillator.frequency.setValueAtTime(880, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.8, audioCtx.currentTime);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
        }

        if (navigator.vibrate) {
            navigator.vibrate([500, 200, 500, 200, 500]);
        }
    }

    function stopAlarmSound() {
        if (!isBeeping) return;
        isBeeping = false;

        if (alarmTimer) {
            clearInterval(alarmTimer);
            alarmTimer = null;
        }

        if (oscillator) {
            try {
                oscillator.stop();
                oscillator.disconnect();
            } catch (e) {}
            oscillator = null;
        }
    }

    function checkMotion() {
        motionCtx.drawImage(video, 0, 0, motionCanvas.width, motionCanvas.height);
        const currentFrame = motionCtx.getImageData(0, 0, motionCanvas.width, motionCanvas.height);

        if (!prevFrameData) {
            prevFrameData = currentFrame;
            return false;
        }

        const threshold = parseInt(sensitivityInput.value);
        const scaleX = motionCanvas.width / canvas.width;
        const scaleY = motionCanvas.height / canvas.height;

        const zoneX = trackZone ? Math.floor(trackZone.x * scaleX) : 0;
        const zoneY = trackZone ? Math.floor(trackZone.y * scaleY) : 0;
        const zoneW = trackZone ? Math.floor(trackZone.w * scaleX) : motionCanvas.width;
        const zoneH = trackZone ? Math.floor(trackZone.h * scaleY) : motionCanvas.height;

        let changedPixels = 0;
        const totalPixelsInZone = zoneW * zoneH;

        for (let y = zoneY; y < zoneY + zoneH; y++) {
            for (let x = zoneX; x < zoneX + zoneW; x++) {
                const i = (y * motionCanvas.width + x) * 4;
                if (i >= 0 && i < currentFrame.data.length) {
                    const diff = Math.abs(currentFrame.data[i] - prevFrameData.data[i]) +
                                 Math.abs(currentFrame.data[i+1] - prevFrameData.data[i+1]) +
                                 Math.abs(currentFrame.data[i+2] - prevFrameData.data[i+2]);
                    if (diff > threshold * 3) {
                        changedPixels++;
                    }
                }
            }
        }

        prevFrameData = currentFrame;
        return (changedPixels / totalPixelsInZone) > 0.06;
    }

    function toggleAlarmSystem() {
        initAudio();
        systemActive = !systemActive;

        if (systemActive) {
            requestWakeLock();
            alarmToggleBtn.innerText = "ЗУПИНИТИ";
            alarmToggleBtn.style.background = "#dc2626";
            statusDiv.className = "status-badge active";
            statusDiv.innerText = "ОХОРОНА АКТИВНА (СПИМО)";
        } else {
            releaseWakeLock();
            alarmToggleBtn.innerText = "УВІМКНУТИ";
            alarmToggleBtn.style.background = "var(--accent-success)";
            statusDiv.className = "status-badge";
            statusDiv.innerText = "МОНІТОРИНГ ЗУПИНЕНО";
            stopAlarmSound();
            exitEcoMode();
        }
    }

    function toggleZoneDrawing() {
        drawingMode = !drawingMode;
        toggleZoneBtn.classList.toggle('active', drawingMode);
        toggleZoneBtn.innerText = drawingMode ? "Виділіть авто..." : "+ Зона фури";
    }

    function clearZone() {
        trackZone = null;
        toggleZoneBtn.innerText = "+ Зона фури";
    }

    canvas.addEventListener('touchstart', handlePointerDown);
    canvas.addEventListener('mousedown', handlePointerDown);

    function handlePointerDown(e) {
        if (!drawingMode) return;
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;

        startX = (clientX - rect.left) * (canvas.width / rect.width);
        startY = (clientY - rect.top) * (canvas.height / rect.height);
        isDrawing = true;
    }

    canvas.addEventListener('touchmove', handlePointerMove);
    canvas.addEventListener('mousemove', handlePointerMove);

    function handlePointerMove(e) {
        if (!isDrawing) return;
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;

        currentX = (clientX - rect.left) * (canvas.width / rect.width);
        currentY = (clientY - rect.top) * (canvas.height / rect.height);
    }

    canvas.addEventListener('touchend', handlePointerUp);
    canvas.addEventListener('mouseup', handlePointerUp);

    function handlePointerUp() {
        if (!isDrawing) return;
        isDrawing = false;
        const x = Math.min(startX, currentX);
        const y = Math.min(startY, currentY);
        const w = Math.abs(currentX - startX);
        const h = Math.abs(currentY - startY);

        if (w > 20 && h > 20) {
            trackZone = { x, y, w, h };
        }
        drawingMode = false;
        toggleZoneBtn.classList.remove('active');
        toggleZoneBtn.innerText = "Зона виділена";
    }

    function mainLoop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        if (trackZone) {
            ctx.strokeStyle = '#2563eb';
            ctx.lineWidth = 3;
            ctx.setLineDash([8, 4]);
            ctx.strokeRect(trackZone.x, trackZone.y, trackZone.w, trackZone.h);
            ctx.setLineDash([]);
            ctx.fillStyle = '#2563eb';
            ctx.font = 'bold 14px sans-serif';
            ctx.fillText("ЗОНА СТЕЖЕННЯ", trackZone.x + 6, trackZone.y + 20);
        }

        if (isDrawing) {
            ctx.strokeStyle = '#10b981';
            ctx.lineWidth = 2;
            ctx.strokeRect(startX, startY, currentX - startX, currentY - startY);
        }

        if (systemActive) {
            const hasMotion = checkMotion();
            if (hasMotion) {
                statusDiv.className = "status-badge alarm";
                statusDiv.innerText = "УВАГА! ЧЕРГА РУХАЄТЬСЯ!";
                startAlarmSound();
            } else {
                statusDiv.className = "status-badge active";
                statusDiv.innerText = "ОХОРОНА АКТИВНА (СПОКІЙНО)";
                stopAlarmSound();
            }
        }

        requestAnimationFrame(mainLoop);
    }

    async function main() {
        try {
            await getCameras();
            await setupCamera();
            statusDiv.innerText = "СИСТЕМА ГОТОВА";
            mainLoop();
        } catch (err) {
            statusDiv.innerText = "Помилка: " + err.message;
        }
    }

    main();
</script>
</body>
</html>
